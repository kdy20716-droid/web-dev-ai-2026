<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Game Projects</title>
    <meta name="color-scheme" content="dark only" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:," />
    <!-- 포트폴리오 아이콘(파비콘) 자동 생성 스크립트 -->
    <script>
      (function setPortfolioFavicon() {
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");

        // 1. 배경 (둥근 사각형 - 어두운 회색)
        ctx.fillStyle = "#333";
        ctx.beginPath();
        // 브라우저 호환성을 위해 roundRect가 없으면 rect로 대체
        if (ctx.roundRect) {
          ctx.roundRect(4, 4, 56, 56, 16);
        } else {
          ctx.rect(4, 4, 56, 56);
        }
        ctx.fill();

        // 2. 텍스트 (P - 흰색)
        ctx.fillStyle = "white";
        ctx.font = "bold 40px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("P", 32, 34); // 중앙 정렬

        // 3. 파비콘 적용
        let link = document.querySelector("link[rel~='icon']");
        if (!link) {
          link = document.createElement("link");
          link.rel = "icon";
          document.head.appendChild(link);
        }
        link.href = canvas.toDataURL();
      })();
    </script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: white;
        font-family: "Noto Sans KR", sans-serif;
        color-scheme: dark;
      }

      .container {
        text-align: center;
        padding: 40px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        max-width: 600px;
        width: 90%;
      }

      h1 {
        margin-bottom: 40px;
        font-size: 2.5rem;
        font-weight: 900;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        background: linear-gradient(to right, #fff, #aaa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .game-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .game-card {
        display: flex;
        align-items: center;
        text-decoration: none;
        color: white;
        padding: 20px;
        border-radius: 15px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .game-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      }

      .game-card .icon {
        font-size: 40px;
        margin-right: 20px;
      }

      .game-card .info {
        text-align: left;
      }

      .game-card .title {
        display: block;
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 5px;
      }

      .game-card .desc {
        display: block;
        font-size: 0.9rem;
        opacity: 0.8;
      }

      /* 라이어 룰렛 스타일 */
      .liar {
        background: linear-gradient(45deg, #8e0e00, #1f1c18);
      }
      .liar:hover {
        border-color: #ff5252;
      }

      /* 수박 게임 스타일 */
      .suika {
        background: linear-gradient(45deg, #11998e, #38ef7d);
      }
      .suika:hover {
        border-color: #69f0ae;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎮 GAME PROJECT</h1>
      <p>수정 작업 중 입니다!</p>
      <div class="game-list">
        <a
          href="./liars-roulette/liars-roulette.html"
          target="_blank"
          class="game-card liar"
        >
          <span class="icon">🔫</span>
          <div class="info">
            <span class="title">라이어 룰렛</span>
            <span class="desc">심리전과 운의 대결, 최후의 승자는?</span>
          </div>
        </a>
        <a href="./suika/suika.html" target="_blank" class="game-card suika">
          <span class="icon">🍉</span>
          <div class="info">
            <span class="title">수박 게임</span>
            <span class="desc">과일을 합쳐 수박을 만들어보세요!</span>
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
