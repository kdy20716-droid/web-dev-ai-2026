<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="practice11-login.css" />
  </head>
  <body>
    <div class="container">
      <h1>로그인</h1>
      <form id="loginForm">
        <div class="input-group">
          <label for="id">아이디</label>
          <input type="text" id="id" placeholder="아이디를 입력하세요" />
        </div>

        <div class="input-group">
          <label for="pw">비밀번호</label>
          <input type="password" id="pw" placeholder="비밀번호를 입력하세요" />
        </div>

        <button type="submit" id="loginBtn">로그인</button>

        <div class="links">
          계정이 없으신가요? <a href="practice10-register.html">회원가입</a>
        </div>
      </form>
    </div>

    <script src="practice11-login.js"></script>
  </body>
</html>
