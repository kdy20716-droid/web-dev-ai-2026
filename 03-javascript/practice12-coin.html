<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>업비트 실시간 시세</title>
    <style>
      body {
        font-family: "Noto Sans KR", sans-serif;
        padding: 20px;
        text-align: center;
      }
      h1 {
        margin-bottom: 20px;
      }
      table {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        border-collapse: collapse;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: center;
      }
      th {
        background-color: #f8f9fa;
        font-weight: bold;
      }
      /* 상승(빨강), 하락(파랑) 색상 */
      .up {
        color: #c84a31;
      }
      .down {
        color: #1261c4;
      }
      .same {
        color: #333;
      }

      /* 테이블 행 호버 효과 */
      tbody tr:hover {
        background-color: #f5f5f5;
        cursor: pointer;
      }

      /* 모달 스타일 */
      .modal {
        display: none; /* 기본적으로 숨김 */
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5); /* 반투명 배경 */
      }
      .modal-content {
        background-color: #fff;
        margin: 15% auto;
        padding: 20px;
        border-radius: 10px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        text-align: left;
        position: relative;
      }
      .close {
        position: absolute;
        right: 20px;
        top: 15px;
        font-size: 28px;
        font-weight: bold;
        color: #aaa;
        cursor: pointer;
      }
      .close:hover {
        color: #000;
      }
      .modal-info p {
        margin: 10px 0;
        border-bottom: 1px solid #eee;
        padding-bottom: 5px;
      }

      /* 거래대금 변경 애니메이션 */
      @keyframes flash {
        0% {
          color: #c84a31;
          background-color: rgba(200, 74, 49, 0.1);
        }
        100% {
          color: black;
          background-color: transparent;
        }
      }
      .flash-red {
        animation: flash 2s ease-out;
      }
    </style>
  </head>
  <body>
    <h1>📈 업비트 실시간 시세 (KRW)</h1>
    <div style="margin-bottom: 20px">
      <input
        type="text"
        id="coin-input"
        placeholder="코인 심볼 (예: DOGE)"
        style="padding: 8px"
      />
      <button id="search-btn" style="padding: 8px 15px; cursor: pointer">
        검색
      </button>
    </div>
    <table>
      <thead>
        <tr>
          <th>코인명</th>
          <th>현재가</th>
          <th>전일대비</th>
          <th>거래대금(24H)</th>
        </tr>
      </thead>
      <tbody id="coin-list">
        <!-- 자바스크립트로 데이터가 들어갈 곳 -->
      </tbody>
    </table>

    <!-- 상세 정보 모달창 -->
    <div id="coin-modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modal-title" style="margin-top: 0">코인 상세 정보</h2>
        <div id="modal-body" class="modal-info"></div>
      </div>
    </div>

    <script src="practice12-coin.js"></script>
  </body>
</html>
