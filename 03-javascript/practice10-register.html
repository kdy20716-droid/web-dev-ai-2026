<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="practice10-register.css" />
  </head>
  <body>
    <div class="container">
      <h1>회원가입</h1>
      <form id="registerForm">
        <div class="input-group">
          <label for="id">아이디</label>
          <input type="text" id="id" placeholder="영문 소문자, 숫자 4~12자" />
          <p class="message" id="idMsg"></p>
        </div>

        <div class="input-group">
          <label for="pw">비밀번호</label>
          <input
            type="password"
            id="pw"
            placeholder="영문, 숫자, 특수문자 포함 8자 이상"
          />
          <p class="message" id="pwMsg"></p>
        </div>

        <div class="input-group">
          <label for="pwCheck">비밀번호 재입력</label>
          <input
            type="password"
            id="pwCheck"
            placeholder="비밀번호를 다시 입력하세요"
          />
          <p class="message" id="pwCheckMsg"></p>
        </div>

        <div class="input-group">
          <label for="name">이름</label>
          <input type="text" id="name" placeholder="한글 또는 영문 2자 이상" />
          <p class="message" id="nameMsg"></p>
        </div>

        <div class="input-group">
          <label for="email">이메일</label>
          <input type="text" id="email" placeholder="example@domain.com" />
          <p class="message" id="emailMsg"></p>
        </div>

        <div class="input-group">
          <label for="phone">전화번호</label>
          <input type="text" id="phone" placeholder="010-0000-0000" />
          <p class="message" id="phoneMsg"></p>
        </div>

        <div class="btn-group">
          <button type="submit" id="submitBtn">회원가입</button>
          <button type="button" id="cancelBtn">취소</button>
        </div>
      </form>
    </div>
    <script src="practice10-register.js"></script>
  </body>
</html>
