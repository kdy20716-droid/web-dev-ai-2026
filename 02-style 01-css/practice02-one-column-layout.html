<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Column Layout</title>
    <link rel="stylesheet" href="practice02-one-column-layout.css" />
  </head>
  <body>
    <div class="header">
      <div class="logo">LOGO</div>
      <div class="menu">
        <a href="#section1">닭</a>
        <a href="#section2">북극곰</a>
        <a href="#section3">고양이</a>
      </div>
    </div>
    <div class="first-section" tabindex="0">
      <div id="section1" class="anchor"></div>
      <h1>닭</h1>
      <img src="assest/키운다메.jpg" class="hidden-img" alt="image" />
      <p>키운다며?! 키운다며!</p>
    </div>
    <div class="second-section" tabindex="0">
      <div id="section2" class="anchor"></div>
      <h1>북극곰</h1>
      <img src="assest/bear.jpg" class="hidden-img" alt="image" />
      <p>"북극곰은 사람을 찢어"</p>
    </div>
    <div class="third-section" tabindex="0">
      <div id="section3" class="anchor"></div>
      <h1>고양이</h1>
      <img src="assest/take_a_look.jpg" class="hidden-img" alt="image" />
      <p>take a look</p>
    </div>
  </body>
</html>
