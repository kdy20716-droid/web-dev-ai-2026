<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>One Column Layout</title>
    <link rel="stylesheet" href="practice02-one-column-layout.css" />
  </head>
  <body>
    <div class="header">
      <div class="logo">MEME</div>
      <div class="menu">
        <a href="#section1">닭</a>
        <a href="#section2">판다</a>
        <a href="#section3">고양이</a>
        <a href="#section4">강아지</a>
        <a href="#section5">라쿤</a>
      </div>
    </div>
    <div id="section1" class="first-section" tabindex="0">
      <h1>닭</h1>
      <img src="assest/chicken-dance.gif" class="hidden-img" alt="image" />
      <p>이러면 키워주시나요?</p>
    </div>
    <div id="section2" class="second-section" tabindex="0">
      <h1>판다</h1>
      <img src="assest/kung-fu-panda.gif" class="hidden-img" alt="image" />
      <p>"아뵤오오오"</p>
    </div>
    <div id="section3" class="third-section" tabindex="0">
      <h1>고양이</h1>
      <img src="assest/뗴껄룩,댄스.gif" class="hidden-img" alt="image" />
      <p>뗴껄룩 댄스</p>
    </div>
    <div id="section4" class="fourth-section" tabindex="0">
      <h1>강아지</h1>
      <!-- assest 폴더에 dog.gif 파일을 넣어주세요 -->
      <img
        src="assest/ai-dog-dancing-dog-dancing.gif"
        class="hidden-img"
        alt="움직이는 강아지"
      />
      <p>춤추는 허숙휘씨</p>
    </div>
    <div id="section5" class="fifth-section" tabindex="0">
      <h1>라쿤</h1>
      <img src="assest/라쿤페드로댄스.gif" class="hidden-img" alt="image" />
      <p>라쿤페드로댄스</p>
    </div>
  </body>
</html>
